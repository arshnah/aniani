name: Build releases

on:
  push:
    branches: [main, rust-remake]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write  # softprops/action-gh-release needs this to create the release; default token grants read-only

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build aniani.exe
        run: cargo build --release

      - name: Verify the exe was actually produced
        shell: pwsh
        run: |
          if (-not (Test-Path "target\release\aniani.exe")) {
            Write-Error "target\release\aniani.exe was not produced by the build"
            exit 1
          }
          Get-Item "target\release\aniani.exe" | Format-List Name, Length

      - name: Smoke test -- actually launch it and confirm it doesn't crash
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "target\release\aniani.exe" -PassThru `
            -RedirectStandardOutput "smoke-stdout.log" -RedirectStandardError "smoke-stderr.log"
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            Write-Host "---- stdout ----"
            Get-Content "smoke-stdout.log" -ErrorAction SilentlyContinue
            Write-Host "---- stderr ----"
            $stderr = Get-Content "smoke-stderr.log" -ErrorAction SilentlyContinue
            $stderr | ForEach-Object { Write-Host $_ }
            if ($stderr -match "NoSuitableAdapterFound|opengl 2\.0\+") {
              Write-Host "no GPU adapter on this CI runner -- known windows-latest limitation, not an app crash. compile + exe-produced already verified above."
              exit 0
            }
            Write-Error "aniani.exe exited on its own within 8s (exit code $($proc.ExitCode)) -- treating as a crash"
            exit 1
          }
          Write-Host "aniani.exe is still running after 8s, looks alive"
          Stop-Process -Id $proc.Id -Force

      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: smoke-std*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: aniani-windows
          path: target/release/aniani.exe
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/aniani.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install native deps (winit/wgpu windowing + reqwest TLS)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev \
            libwayland-dev libssl-dev libasound2-dev pkg-config

      - name: Build aniani
        run: cargo build --release

      - name: Verify the binary was actually produced
        run: |
          test -f target/release/aniani || { echo "target/release/aniani was not produced by the build"; exit 1; }
          ls -la target/release/aniani

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/aniani dist/aniani
          chmod +x dist/aniani
          tar -C dist -czf aniani-linux-x86_64.tar.gz aniani

      - uses: actions/upload-artifact@v4
        with:
          name: aniani-linux
          path: aniani-linux-x86_64.tar.gz
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: aniani-linux-x86_64.tar.gz
