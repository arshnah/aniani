[package]
name = "aniani"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "accesskit"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", features = ["png", "jpeg"] }
reqwest = { version = "0.12", features = ["json", "blocking", "cookies"] }
anyhow = "1"
rand = "0.8"
quick-xml = { version = "0.36", features = ["serialize"] }
urlencoding = "2"
open = "5"
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "process", "io-util", "macros"] }
dirs = "5"
which = "6"
discord-rich-presence = "0.2"
regex = "1"

[profile.release]
opt-level = 3
